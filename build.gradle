import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

def matrix = new JsonSlurper().parse(file('config/targets.json'))
def targetName = providers.gradleProperty('target').getOrElse(matrix.default)
def target = matrix.targets[targetName]
if (target == null) throw new GradleException("Unknown target '${targetName}'. Choose ${matrix.targets.keySet()}.")
def mtr = matrix.mtr[target.variant]
version = providers.gradleProperty('modVersion').get()
if (!(version ==~ /0\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?/)) {
    throw new GradleException('Development releases must use a 0.x.x version.')
}
group = matrix.javaPackage
base.archivesName = "${rootProject.name}-${targetName}"

java.toolchain.languageVersion = JavaLanguageVersion.of(matrix.java as int)
repositories { mavenCentral() }

neoForge {
    enable {
        version = target.neoForge
        disableRecompilation = true
    }
    runs {
        client {
            client()
            gameDirectory = file("build/run/${targetName}")
        }
    }
    mods {
        mtr_memory_sharing { sourceSet sourceSets.main }
    }
}

sourceSets {
    main {
        java.setSrcDirs(['src/main/java', "src/targets/${target.variant}/java"])
        if (target.variant == 'v6') java.exclude('**/VertexColorMixin.java')
        resources.srcDir(layout.buildDirectory.dir("generated/resources/${targetName}"))
    }
    test { java.srcDirs = ['src/test/java'] }
}

def mtrFile = providers.gradleProperty('mtrJar').map { file(it) }
        .getOrElse(file(".cache/dependencies/mtr-${target.variant}.jar"))
def sha256 = { File value ->
    MessageDigest md = MessageDigest.getInstance('SHA-256')
    value.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int count; (count = input.read(buffer)) != -1;) md.update(buffer, 0, count)
    }
    md.digest().encodeHex().toString()
}

tasks.register('prepareMtr') {
    inputs.property('releaseSha256', mtr.sha256)
    outputs.file(mtrFile)
    // Verify even a previously cached or explicitly supplied artifact.
    outputs.upToDateWhen { false }
    doLast {
        if (!mtrFile.isFile()) {
            if (!mtr.url || providers.gradleProperty('mtrJar').isPresent()) {
                throw new GradleException("Supply the audited ${target.variant} MTR JAR with -PmtrJar=<path>. No game instance is required.")
            }
            mtrFile.parentFile.mkdirs()
            File partial = new File(mtrFile.parentFile, mtrFile.name + '.partial')
            try {
                def connection = new URI(mtr.url).toURL().openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 60000
                connection.getInputStream().withCloseable { input -> partial.withOutputStream { it << input } }
                if (sha256(partial) != mtr.sha256) throw new GradleException('Downloaded MTR fingerprint differs from the selected target.')
                Files.move(partial.toPath(), mtrFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } finally { if (partial.exists()) partial.delete() }
        }
        if (sha256(mtrFile) != mtr.sha256) throw new GradleException('MTR fingerprint differs from the selected target; version labels are insufficient.')
    }
}

dependencies {
    compileOnly files(mtrFile)
    runtimeOnly files(mtrFile)
    testImplementation files(mtrFile)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('prepareMtr')
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none', '-Xlint:unchecked']
    options.release = matrix.java as int
    options.debugOptions.debugLevel = 'source,lines'
}

tasks.register('generateMetadata') {
    inputs.file('config/targets.json')
    inputs.property('modVersion', project.version.toString())
    inputs.property('target', targetName)
    def destination = layout.buildDirectory.dir("generated/resources/${targetName}")
    outputs.dir(destination)
    doLast {
        File output = destination.get().asFile
        new File(output, 'META-INF').mkdirs()
        def writeJson = { String path, Object object ->
            File destinationFile = new File(output, path)
            destinationFile.parentFile.mkdirs()
            destinationFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(object)) + '\n', 'UTF-8')
        }
        writeJson('mtr-memory-target.json', [target: targetName, version: project.version.toString(),
                minecraft: matrix.minecraft, neoForge: target.neoForge, mtrSha256: mtr.sha256, variant: target.variant])
        writeJson('mtr-memory-sharing.mixins.json', [required: true, minVersion: '0.8',
                package: matrix.javaPackage + '.mixin', plugin: matrix.javaPackage + '.CompatibilityPlugin',
                compatibilityLevel: 'JAVA_21', client: matrix.mixins + matrix.variantMixins[target.variant],
                injectors: [defaultRequire: 1]])
        new File(output, 'META-INF/neoforge.mods.toml').setText("""modLoader="lowcodefml"
loaderVersion="[4,)"
license="MIT"
[[mods]]
modId="${matrix.modId}"
version="${project.version}"
displayName="${matrix.modName}"
authors="A-BenLi06"
description="Shared resource loading for Minecraft Transit Railway."
logoFile="pack.png"
logoBlur=false
[[dependencies.${matrix.modId}]]
modId="neoforge"
type="required"
versionRange="[${target.neoForge}]"
ordering="NONE"
side="CLIENT"
[[dependencies.${matrix.modId}]]
modId="minecraft"
type="required"
versionRange="[${matrix.minecraft}]"
ordering="NONE"
side="CLIENT"
[[dependencies.${matrix.modId}]]
modId="mtr"
type="required"
versionRange="[${mtr.version}]"
ordering="AFTER"
side="CLIENT"
[[mixins]]
config="mtr-memory-sharing.mixins.json"
""", 'UTF-8')
    }
}

tasks.named('processResources') { dependsOn tasks.named('generateMetadata') }
tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '768m'
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    from('LICENSE')
    manifest.attributes('Implementation-Version': project.version, 'MTR-Memory-Target': targetName)
}
tasks.register('buildManifest') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.jar.archiveFile)
    inputs.files(sourceSets.main.allSource, file('config/targets.json'), file('build.gradle'))
    inputs.property('target', targetName)
    inputs.property('version', project.version.toString())
    def destination = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.build.json")
    outputs.file(destination)
    doLast {
        File jarFile = tasks.jar.archiveFile.get().asFile
        def hashes = [:]
        (sourceSets.main.allSource.files + file('config/targets.json') + file('build.gradle')).findAll { it.isFile() }
                .sort { it.path }.each { hashes[relativePath(it).replace('\\', '/')] = sha256(it) }
        destination.get().asFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                version: project.version.toString(), target: targetName, java: matrix.java, mtrSha256: mtr.sha256,
                neoForge: target.neoForge, artifact: jarFile.name, sha256: sha256(jarFile), inputs: hashes])) + '\n', 'UTF-8')
    }
}
tasks.register('verifyRelease') {
    dependsOn tasks.named('buildManifest')
    inputs.file(tasks.jar.archiveFile)
    doLast {
        File jarFile = tasks.jar.archiveFile.get().asFile
        def recorded = new JsonSlurper().parse(file("build/libs/${base.archivesName.get()}-${version}.build.json"))
        if (recorded.sha256 != sha256(jarFile)) throw new GradleException('Release identity manifest is stale.')
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def json = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing release resource ${path}")
                zip.getInputStream(entry).withCloseable { new JsonSlurper().parse(it) }
            }
            def mixins = json('mtr-memory-sharing.mixins.json')
            (mixins.client + [mixins.plugin.substring(matrix.javaPackage.length() + 1)]).each { name ->
                String packagePath = name == 'CompatibilityPlugin' ? matrix.javaPackage : mixins.package
                if (zip.getEntry(packagePath.replace('.', '/') + '/' + name + '.class') == null)
                    throw new GradleException("Missing configured Mixin/plugin class ${name}")
            }
            if (json('pack.mcmeta').pack.pack_format != matrix.packFormat)
                throw new GradleException('Pack format does not match selected Minecraft target.')
            if (json('mtr-memory-target.json').mtrSha256 != mtr.sha256)
                throw new GradleException('Runtime fingerprint metadata does not match build target.')
            if (zip.getEntry('pack.png') == null || zip.getEntry('LICENSE') == null)
                throw new GradleException('Release icon/license missing.')
        }
    }
}
tasks.named('build') { dependsOn tasks.named('verifyRelease') }
tasks.register('releaseBundle', Zip) {
    dependsOn tasks.named('build')
    archiveBaseName = "${rootProject.name}-${targetName}"
    destinationDirectory = layout.buildDirectory.dir('releases')
    from(tasks.jar.archiveFile)
    from(tasks.named('buildManifest').map { it.outputs.files })
    from('LICENSE', 'README.md', 'docs/INSTALL.md', 'docs/SUPPORT.md')
}
