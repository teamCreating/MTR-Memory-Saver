def suppliedMtr = providers.gradleProperty('mtrJar').map { file(it) }.getOrNull()
// A verified canonical dependency name also avoids Windows Java argument-file
// decoding failures for user-supplied non-ASCII artifact filenames.
def mtrFile = file(".cache/dependencies/mtr-${mtr.sha256}.jar")
def sha256 = { File value ->
    MessageDigest md = MessageDigest.getInstance('SHA-256')
    value.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int count; (count = input.read(buffer)) != -1;) md.update(buffer, 0, count)
    }
    md.digest().encodeHex().toString()
}

tasks.register('prepareMtr') {
    inputs.property('releaseSha256', mtr.sha256)
    if (suppliedMtr != null) inputs.file(suppliedMtr)
    outputs.file(mtrFile)
    // Verify even a previously cached or explicitly supplied artifact.
    outputs.upToDateWhen { false }
    doLast {
        if (suppliedMtr != null) {
            if (!suppliedMtr.isFile() || sha256(suppliedMtr) != mtr.sha256)
                throw new GradleException('Supplied MTR fingerprint differs from the selected target.')
            mtrFile.parentFile.mkdirs()
            if (!mtrFile.isFile() || sha256(mtrFile) != mtr.sha256)
                Files.copy(suppliedMtr.toPath(), mtrFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        if (!mtrFile.isFile()) {
            if (!mtr.url) {
                throw new GradleException("Supply the audited ${target.variant} MTR JAR with -PmtrJar=<path>. No game instance is required.")
            }
            mtrFile.parentFile.mkdirs()
            File partial = new File(mtrFile.parentFile, mtrFile.name + '.partial')
            try {
                def connection = new URI(mtr.url).toURL().openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 60000
                connection.getInputStream().withCloseable { input -> partial.withOutputStream { it << input } }
                if (sha256(partial) != mtr.sha256) throw new GradleException('Downloaded MTR fingerprint differs from the selected target.')
                Files.move(partial.toPath(), mtrFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } finally { if (partial.exists()) partial.delete() }
        }
        if (sha256(mtrFile) != mtr.sha256) throw new GradleException('MTR fingerprint differs from the selected target; version labels are insufficient.')
        new java.util.zip.ZipFile(mtrFile).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (entry == null) throw new GradleException('Audited MTR loader metadata is missing.')
            String metadata = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
            def declared = metadata =~ /(?m)^version\s*=\s*"([^"]+)"/
            if (!declared.find() || declared.group(1) != mtr.version)
                throw new GradleException('The target matrix MTR version differs from its audited binary metadata.')
        }
    }
}

dependencies {
    compileOnly files(mtrFile)
    runtimeOnly files(mtrFile)
    testImplementation files(mtrFile)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
