versionRange="[${matrix.minecraft}]"
ordering="NONE"
side="CLIENT"
[[dependencies.${neutralSpec.mod_id}]]
modId="mtr"
type="required"
versionRange="[${mtr.version}]"
ordering="AFTER"
side="CLIENT"
[[mixins]]
config="mtr-native-observer.mixins.json"
""", 'UTF-8')
    }
}
tasks.named('processNeutralProbeResources') { dependsOn tasks.named('generateNeutralProbeMetadata') }
tasks.register('neutralProbeJar', Jar) {
    dependsOn tasks.named('neutralProbeClasses')
    archiveBaseName = "mtr-native-observer-${targetName}"
    archiveVersion = neutralSpec.observer_version
    from(sourceSets.neutralProbe.output)
    from('LICENSE')
    manifest.attributes('Implementation-Version': neutralSpec.observer_version, 'MTR-Native-Observer-Target': targetName)
}
tasks.register('neutralProbeTest', Test) {
    testClassesDirs = sourceSets.neutralProbeTest.output.classesDirs
    classpath = sourceSets.neutralProbeTest.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = '512m'
    systemProperty('neutralProbeJfrOutput', layout.buildDirectory.file("neutral-probe/${targetName}/frame-events.jfr").get().asFile.absolutePath)
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.register('neutralProbeManifest') {
    dependsOn tasks.named('neutralProbeJar')
    inputs.file(tasks.named('neutralProbeJar').flatMap { it.archiveFile })
    inputs.files(sourceSets.neutralProbe.allSource, neutralSpecFile, file('config/targets.json'), file('build.gradle'))
    def destination = layout.buildDirectory.file("libs/mtr-native-observer-${targetName}-${neutralSpec.observer_version}.build.json")
    outputs.file(destination)
    doLast {
        File jarFile = tasks.named('neutralProbeJar').get().archiveFile.get().asFile
        def hashes = [:]
        (sourceSets.neutralProbe.allSource.files + neutralSpecFile + file('config/targets.json') + file('build.gradle'))
                .findAll { it.isFile() }.sort { it.path }.each { hashes[relativePath(it).replace('\\', '/')] = sha256(it) }
        destination.get().asFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                schema_version: neutralSpec.schema_version, observer_version: neutralSpec.observer_version,
                target: targetName, artifact: jarFile.name, sha256: sha256(jarFile),
                mtrSha256: mtr.sha256, neoForge: target.neoForge, minecraft: matrix.minecraft, java: matrix.java,
                capabilities: neutralSpec.capabilities, inputs: hashes,
                scope: 'Tool engineering only; actual loader application, client qualification and observer-off calibration remain unverified'])) + '\n', 'UTF-8')
    }
}
tasks.register('verifyNeutralProbe') {
    dependsOn tasks.named('neutralProbeManifest'), tasks.named('neutralProbeTest')
    inputs.file(tasks.named('neutralProbeJar').flatMap { it.archiveFile })
    doLast {
        File jarFile = tasks.named('neutralProbeJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def json = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing native observer resource ${path}")
                zip.getInputStream(entry).withCloseable { new JsonSlurper().parse(it) }
            }
            def identity = json('mtr-native-observer-target.json')
            if (identity.target != targetName || identity.mtrSha256 != mtr.sha256 || identity.neoForge != target.neoForge
                    || identity.observer_version != neutralSpec.observer_version || identity.variant != 'official')
                throw new GradleException('Native observer target metadata differs from its selected target.')
            if (json('capabilities.json').capabilities != neutralSpec.capabilities)
                throw new GradleException('Native observer capabilities differ from their source contract.')
            def mixins = json('mtr-native-observer.mixins.json')
            (mixins.client.collect { mixins.package + '.' + it } + mixins.plugin + 'dev.abenli.neutralprobe.NativeObserver').each { name ->
                if (zip.getEntry(name.replace('.', '/') + '.class') == null)
                    throw new GradleException("Missing native observer class ${name}")
            }
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    if (!entry.name.startsWith('dev/abenli/neutralprobe/') && !entry.name.startsWith('dev/abenli/probeio/'))
                        throw new GradleException("Unexpected native observer class ${entry.name}")
                    String pool = zip.getInputStream(entry).withCloseable { new String(it.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1) }
                    ['site/benli06', 'site.benli06', 'getCachedVehicleResource', 'awaitParsing', 'java/lang/reflect'].each { forbidden ->
                        if (pool.contains(forbidden)) throw new GradleException("Forbidden native observer class reference ${forbidden}")
                    }
                }
            }
        }
        def recorded = new JsonSlurper().parse(file("build/libs/mtr-native-observer-${targetName}-${neutralSpec.observer_version}.build.json"))
        if (recorded.sha256 != sha256(jarFile)) throw new GradleException('Native observer manifest is stale.')
    }
}
